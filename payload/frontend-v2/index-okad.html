    <script>
      (function () {
        'use strict';
        var prefix = '/okad';
        function qualify(value) {
          return typeof value === 'string' && value.indexOf('/api/') === 0 ? prefix + value : value;
        }
        var fetchImpl = window.fetch.bind(window);
        window.fetch = function (input, init) {
          if (typeof input === 'string') input = qualify(input);
          else if (input && input.url && qualify(input.url) !== input.url) input = new Request(qualify(input.url), input);
          return fetchImpl(input, init);
        };
        var open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          arguments[1] = qualify(url);
          return open.apply(this, arguments);
        };
      })();
    </script>
