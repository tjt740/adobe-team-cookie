MODE=active
TARGET_PER_ADMIN=9
RELOGIN_AFTER_HOURS=12
PULL_CAP_PER_RUN=30
PUSH_CAP_PER_RUN=50
RELOGIN_CAP_PER_RUN=3
AUTO_RELOGIN=false
EMAIL_POOL_WARN=100
ALERT_MODE=smart
# —— Sub2 余额自愈(开):余额<BALANCE_FLOOR 或残号(上限10刷新后仍10)→ 删Sub2+踢母号+删本地 ——
AUTO_SUB2_CLEAN=true
CLEAN_CAP_PER_RUN=40
BALANCE_FLOOR=100
# —— 拉号补齐 ——
# AUTO_PULL:自愈清坏号后 1:1 精确补回被删的个数(mode=add)
AUTO_PULL=true
# AUTO_FILL_DEFICIT:每轮把有缺口的母号补到 TARGET_PER_ADMIN(mode=target),受 PULL_CAP_PER_RUN 限总量
AUTO_FILL_DEFICIT=true
# —— 定期测活 + 刷 token(先刷token再真出图;刷新后仍出不了图且明确失败才判死删+补;瞬时/刷新失败一律不删)——
# 出图测活走的是 fi(FF-iOS)协议刷 token,与"子号必须走 cookie 默认协议"冲突 → 关闭。
# 删除判定改为纯余额规则(读不到余额的先 cookie 刷 token+余额,救不回来才判废),见 health_clean。
AUTO_LIVENESS=false
AUTO_LIVENESS_CLEAN=false
LIVENESS_PER_RUN=3
BARK_URL=https://api.day.app/YOUR_BARK_KEY
